name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tier 0: no internal deps
      - name: Publish stynx-code-errors
        run: cargo publish -p stynx-code-errors --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-config
        run: cargo publish -p stynx-code-config --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # Tier 1: depends on errors only
      - name: Publish stynx-code-types
        run: cargo publish -p stynx-code-types --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-auth
        run: cargo publish -p stynx-code-auth --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # Tier 2: depends on errors + config + types (and optionally auth)
      - name: Publish stynx-code-tools
        run: cargo publish -p stynx-code-tools --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-memory
        run: cargo publish -p stynx-code-memory --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-permission
        run: cargo publish -p stynx-code-permission --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-commands
        run: cargo publish -p stynx-code-commands --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-services
        run: cargo publish -p stynx-code-services --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-compact
        run: cargo publish -p stynx-code-compact --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-coordinator
        run: cargo publish -p stynx-code-coordinator --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-bridge
        run: cargo publish -p stynx-code-bridge --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-plugins
        run: cargo publish -p stynx-code-plugins --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-skills
        run: cargo publish -p stynx-code-skills --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-tui
        run: cargo publish -p stynx-code-tui --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish stynx-code-provider
        run: cargo publish -p stynx-code-provider --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # Tier 3: depends on tools
      - name: Publish stynx-code-engine
        run: cargo publish -p stynx-code-engine --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # Tier 4: depends on provider + engine + tools
      - name: Publish stynx-code-server
        run: cargo publish -p stynx-code-server --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      # Tier 5: binary crate (depends on everything)
      - name: Publish stynx-code (binary)
        run: cargo publish -p stynx-code --no-verify || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
