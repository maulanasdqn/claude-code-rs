name: Stynx
options:
  bundleIdPrefix: dev.stynx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Stynx:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated/stynx_code_ffi.swift
        group: Generated
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.33.18"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies:
      - framework: Frameworks/StynxCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stynx.desktop
        PRODUCT_NAME: Stynx
        MARKETING_VERSION: "0.33.18"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
          - "-liconv"
          - "-lresolv"
