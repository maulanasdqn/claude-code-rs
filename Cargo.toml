[workspace]
members = [
    "cc-errors",
    "cc-types",
    "cc-tools",
    "cc-provider",
    "cc-engine",
    "cc-server",
    "cc-cli",
    "cc-auth",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cc-errors = { path = "cc-errors" }
cc-types = { path = "cc-types" }
cc-tools = { path = "cc-tools" }
cc-provider = { path = "cc-provider" }
cc-engine = { path = "cc-engine" }
cc-server = { path = "cc-server" }
cc-cli = { path = "cc-cli" }
cc-auth = { path = "cc-auth" }
