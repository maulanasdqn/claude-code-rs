[workspace]
members = [
    "cc-errors",
    "cc-types",
    "cc-tools",
    "cc-provider",
    "cc-engine",
    "cc-server",
    "cc-cli",
    "cc-auth",
    "cc-permission",
    "cc-commands",
    "cc-memory",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"

claude-rust-errors = { version = "0.2.0", path = "cc-errors" }
claude-rust-types = { version = "0.2.0", path = "cc-types" }
claude-rust-tools = { version = "0.2.0", path = "cc-tools" }
claude-rust-provider = { version = "0.2.0", path = "cc-provider" }
claude-rust-engine = { version = "0.2.0", path = "cc-engine" }
claude-rust-server = { version = "0.2.0", path = "cc-server" }
claude-rust = { version = "0.2.0", path = "cc-cli" }
claude-rust-auth = { version = "0.2.0", path = "cc-auth" }
claude-rust-permission = { version = "0.2.0", path = "cc-permission" }
claude-rust-commands = { version = "0.2.0", path = "cc-commands" }
claude-rust-memory = { version = "0.2.0", path = "cc-memory" }
