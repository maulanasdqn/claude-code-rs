[workspace]
members = [
    "claude-rust-errors",
    "claude-rust-types",
    "claude-rust-tools",
    "claude-rust-provider",
    "claude-rust-engine",
    "claude-rust-server",
    "claude-rust",
    "claude-rust-auth",
    "claude-rust-permission",
    "claude-rust-commands",
    "claude-rust-memory",
    "claude-rust-config",
    "claude-rust-services",
    "claude-rust-compact",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
glob = "0.3"
crossterm = "0.28"
indicatif = "0.17"
syntect = { version = "5", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }
base64 = "0.22"

claude-rust-errors = { version = "1.1.0", path = "claude-rust-errors" }
claude-rust-types = { version = "1.1.0", path = "claude-rust-types" }
claude-rust-tools = { version = "1.1.0", path = "claude-rust-tools" }
claude-rust-provider = { version = "1.1.0", path = "claude-rust-provider" }
claude-rust-engine = { version = "1.1.0", path = "claude-rust-engine" }
claude-rust-server = { version = "1.1.0", path = "claude-rust-server" }
claude-rust = { version = "1.1.0", path = "claude-rust" }
claude-rust-auth = { version = "1.1.0", path = "claude-rust-auth" }
claude-rust-permission = { version = "1.1.0", path = "claude-rust-permission" }
claude-rust-commands = { version = "1.1.0", path = "claude-rust-commands" }
claude-rust-memory = { version = "1.1.0", path = "claude-rust-memory" }
claude-rust-config = { version = "1.1.0", path = "claude-rust-config" }
claude-rust-services = { version = "1.1.0", path = "claude-rust-services" }
claude-rust-compact = { version = "1.1.0", path = "claude-rust-compact" }
