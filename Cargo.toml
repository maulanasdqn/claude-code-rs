[workspace]
members = [
    "claude-rust-errors",
    "claude-rust-types",
    "claude-rust-tools",
    "claude-rust-provider",
    "claude-rust-engine",
    "claude-rust-server",
    "claude-rust",
    "claude-rust-auth",
    "claude-rust-permission",
    "claude-rust-commands",
    "claude-rust-memory",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"

claude-rust-errors = { version = "0.2.0", path = "claude-rust-errors" }
claude-rust-types = { version = "0.2.0", path = "claude-rust-types" }
claude-rust-tools = { version = "0.2.0", path = "claude-rust-tools" }
claude-rust-provider = { version = "0.2.0", path = "claude-rust-provider" }
claude-rust-engine = { version = "0.2.0", path = "claude-rust-engine" }
claude-rust-server = { version = "0.2.0", path = "claude-rust-server" }
claude-rust = { version = "0.2.0", path = "claude-rust" }
claude-rust-auth = { version = "0.2.0", path = "claude-rust-auth" }
claude-rust-permission = { version = "0.2.0", path = "claude-rust-permission" }
claude-rust-commands = { version = "0.2.0", path = "claude-rust-commands" }
claude-rust-memory = { version = "0.2.0", path = "claude-rust-memory" }
