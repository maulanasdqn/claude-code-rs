[package]
name = "stynx-code-desktop"
version = "0.33.18"
edition = "2024"
description = "Cross-platform desktop app for stynx (Tauri + Svelte)"
license = "MIT"
repository = "https://github.com/maulanasdqn/stynx-code"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
